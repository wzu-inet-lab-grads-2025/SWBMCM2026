# q1 二维投影约束规划对照实验。题面数据继续从 q1.yaml 读取。
starts_per_axis: 7          # 缩边场地按轴均匀取七点，共 49 个相互独立的第一阶段起点
max_iterations: 150        # 每个 SLSQP 起点的迭代上限，用于记录不收敛情况
solver_ftol: 1.0e-12        # SLSQP 停止精度，兼顾 80° 边界附近的可行性和耗时
radius_check_m: 1.0e-8      # 第一阶段同分、径向舍入修正和二阶段等质量复核的最大距离差（m）
timing_repeats: 5           # 同进程交替运行五次，报告站位求解阶段的中位数
