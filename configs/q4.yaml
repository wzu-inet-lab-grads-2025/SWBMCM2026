# B 题第四问继承第二问（2）已归档的连续站位、路径和调度，路径相对此文件。
q2_archive: ../results/q2/双站定位与并发调度_连续站位_20261120

# 第 5 页：方位从正东逆时针，实验用 15° 等距覆盖整圆；R 取内外端点与中点，H 固定 50 m。
azimuth_step_deg: 15
ranges_m: [30, 40, 50]
alert_height_m: 50
# 第 5 页及命题人答疑：恢复时刻 (5,30] s；均匀取三个恢复档，含最迟的 30 s。
recovery_s: [10, 20, 30]

# 有限候选集：全场 1 m，热点邻域 0.25 m，保留时间与 RMSE 代表配对。
grid_m: 1.0
local_grid_m: 0.25
pair_limit: 40          # 含各参考车对的最快方案，限制四模型共用的候选规模。
near_sites_per_anchor: 7  # 每个参考车位保留少量空间分散的快速邻站，避免扎堆。
quality_slack_s: 1.0    # 在最快就绪时间附近 1 s 内另保留低 RMSE 代表，不作为计分条件。
min_sine: 1.0e-12    # 第二问（1）的数值共线判定，无额外硬精度门槛。
critical_points: 6   # 主网格结束后，按相邻格表现和可见性变化加密。

# 后缀整数优化时钟；原计划与最终验收按连续时间执行。
tick_s: 0.1
fine_tick_s: 0.05
fine_grid_m: 0.5
fine_pair_limit: 60
angle_sensitivity_deg: 5  # 交会角距 0°/180° 的可选门槛，仅近共线对照。
sensitivity_cases: 12     # 覆盖七类扰动，其余名额留给最晚启动的实例。

# 每个精确模型单场景总墙钟预算，包含两阶段及冲突排除；每个模型固定单线程。
exact_budget_s: 1.5
workers: 12  # 原归档的并行进程数，可按机器调整；不计入题面调度延迟。
beam_width: 2  # D 保留两条候选；两精确算法及 ALNS 均从同一 D 初稿启动。
# 每个情景使用同一批随机种子，记录各次结果；每个种子执行固定轮数。
alns_seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
alns_iterations: 12
