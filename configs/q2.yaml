# B 题第二问。第一问配置提供场地、调度中心、楼体、车体半径和闭仰角区间。
scene_config: q1.yaml

# 英文原题第 1–2 页：五辆观测车的初始车心坐标（m）和三条标称告警。
vehicles:
  V1: [15.0, 14.0]
  V2: [88.0, 10.0]
  V3: [14.0, 86.0]
  V4: [88.0, 68.0]
  V5: [50.0, 93.0]
alerts:
  T1: {azimuth_deg: 30.0, range_m: 40.0, height_m: 45.0}
  T2: {azimuth_deg: 150.0, range_m: 45.0, height_m: 35.0}
  T3: {azimuth_deg: 285.0, range_m: 38.0, height_m: 55.0}

# 英文原题第 2–4 页：车速 m/s，云台角速度 度/s，观测及 2（1）单车行驶时限 s。
speed_m_s: 3.0
gimbal_deg_s: 30.0
observation_s: 5.0
q21_travel_limit_s: 30.0
bearing_sigma_deg: 1.0    # 2（1）每车独立方位测量的标准差，单位度。

# 2（2）：保持同告警驻站时两车圆盘不重叠（最小心距 = 两倍车体半径）。
# 路径不含车间等待；对输出调度另作全程轨迹最小车距复核。
grid_m: [5.0, 2.5, 1.25]  # 整场候选站点间距，m。额外加入初始点、边界和 T2 见证点。
path_polygon_sides: 64    # 每个膨胀圆的外切近似边数，4 的倍数。
path_comparison_sides: 32 # 在相同站点与调度上复算路径和计时，量化路径近似影响。
monte_carlo_samples: 100000  # 2（1）每个交会角的样本量，独立测量噪声对数。
random_seed: 42              # 2（1）随机校核复现；2（2）搜索是确定的。
