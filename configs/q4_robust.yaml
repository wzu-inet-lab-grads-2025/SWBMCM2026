# B 题第四问。沿用第二问硬净空和执行误差预算，同一口径验收所有策略与相位。
workers: 12  # 同目标位置分组并行数。
beam_width: 36  # 每层保留的不同后续车辆状态数。
stations_per_vehicle: 8  # 每车用于先筛合法站对的就绪名单长度。
alternatives_per_pair: [2, 8]  # 保留较窄和较宽两档搜索的候选后缀。
replay_candidates: 8  # 每层回放的候选数。
grid_points_per_axis: 4  # 近站矩形的每轴采样数，端点计入。
# 近站候选矩形坐标，m。受墙距限制的场界候选向场内移动。
vehicle_areas_xyxy_m:
  V1: [2, 2, 32, 32]
  V2: [66, 1.5, 98, 20]
  V3: [2, 77.6, 30, 98]
  V4: [81, 48, 98, 85]
  V5: [36, 80, 67, 98]
wall_clearance_m: 0.45  # 所有楼体和场界的最小标称车体净空，m。
execution_error_bound_m: 0.40  # 合成执行误差硬上界的试算值，m，需独立证实。
