# 第四问归档配置快照，引用第二问（2）的原始连续调度归档。
q2_archive: ../../q2/双站定位与并发调度_连续站位_20261120
# 方位角度，距离 m，高度 m，恢复时刻 s。
azimuth_step_deg: 15
ranges_m: [30, 40, 50]
alert_height_m: 50
recovery_s: [10, 20, 30]
# 全场网格、局部细化 m；近似几何保留数量和质量代表的同步开测容许增量（s）。
grid_m: 1.0
local_grid_m: 0.25
pair_limit: 40
near_sites_per_anchor: 7
quality_slack_s: 1.0
min_sine: 1.0e-12
critical_points: 6
# 后缀时钟 s，以及单列的数值敏感性配置。
tick_s: 0.1
fine_tick_s: 0.05
fine_grid_m: 0.5
fine_pair_limit: 60
angle_sensitivity_deg: 5
sensitivity_cases: 12
# A/B 都用单线程，墙钟预算 s；D 初稿的搜索宽度及 C 的固定种子。
exact_budget_s: 1.5
workers: 12
beam_width: 2
alns_seeds: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035]
alns_iterations: 12
