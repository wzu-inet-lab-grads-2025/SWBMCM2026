# B 题第 5 页：恢复后使用现场快照和连续时间重排尚未开测的告警。
# 主样本、原计划和 T4 基线目录均读取 --recourse 指定的归档。
workers: 12
beam_width: 36        # 每层保留的不同后续车辆状态数。
stations_per_vehicle: 8  # 每车配置先按就绪时间筛选，找不到合法站对时扩大搜索。
alternatives_per_pair: [2, 8]  # 分别保留两档站对的搜索结果，避免宽档挤掉窄档的不同复用分支。
replay_candidates: 8     # 每层按预计评分最多回放的候选数。
grid_points_per_axis: 4  # 下列各区域的每轴采样数，端点计入。
# 坐标单位 m。区域种子来自队友 explore/b-first-round 的公开配置，供近站搜索使用。
# 同时进行全场搜索，区域不作为题目约束。圆盘、视线、路径和车距照常核验。
vehicle_areas_xyxy_m:
  V1: [2, 2, 32, 32]
  V2: [66, 1.5, 98, 20]
  V3: [2, 77.6, 30, 98]
  V4: [81, 48, 98, 85]
  V5: [36, 80, 67, 98]
