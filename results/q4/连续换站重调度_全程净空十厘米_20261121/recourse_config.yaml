# 第四问留量工况，沿用连续重调的场景、停联规则、调度和搜索档。
workers: 12  # 目标位置分组并行数。
beam_width: 36  # 每层保留的不同后续车辆状态数。
stations_per_vehicle: 8  # 每车用于先筛合法站对的就绪名单长度。
alternatives_per_pair: [2, 8]  # 两档站对同时保留以比较不同复用分支。
replay_candidates: 8  # 每层回放的候选数。
grid_points_per_axis: 4  # 近站矩形的每轴采样数，端点计入。
# 近站种子矩形，坐标单位 m。种子与连续重调标称版相同。
vehicle_areas_xyxy_m:
  V1: [2, 2, 32, 32]
  V2: [66, 1.5, 98, 20]
  V3: [2, 77.6, 30, 98]
  V4: [81, 48, 98, 85]
  V5: [36, 80, 67, 98]
wall_clearance_m: 0.10  # 行驶、站位和等待全程额外留出的车体净空，单位 m。
