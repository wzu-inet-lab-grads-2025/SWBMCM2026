# B 题第一问单因素敏感性。标称值取第一问归档配置，对照幅度均为试算值，不改题面。
max_strip_width_m: 0.00005  # 连续面积包围的最大竖条宽度，m；沿用标称复核精度。
perturbations:
  elevation_limit_deg: [-1.0, -0.5, 0.5, 1.0]  # 云台仰角上限改变量，度；79° 接续先前单点对照。
  target_height_m: [-2.0, -1.0, 1.0, 2.0]      # T1 告警高度改变量，m；检验高度误差的影响。
  target_east_m: [-0.5, 0.5]                    # T1 水平投影的东西平移量，m，东为正。
  target_north_m: [-0.5, 0.5]                   # T1 水平投影的南北平移量，m，北为正。
  b2_height_m: [-1.0, 1.0]                      # B2 楼顶标高改变量，m；底面不变，只改变视线遮挡。
  added_clearance_m: [0.10, 0.45]              # 车体外缘额外净空，m；与项目其他问的补充工况一致。
